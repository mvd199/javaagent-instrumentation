# Whitelisted classes and packages for duration instrumentation
# Supports:
#   - Exact match: com.example.Foo
#   - Single-level wildcard: com.example.* (direct classes in package)
#   - Recursive wildcard: com.example.** (package and all subpackages)
#   - Blank lines and '#' comments are ignored
# JDK (java.*, javax.*, jdk.*, sun.*, com.sun.*) and agent classes are never instrumented.

com.fasterxml.jackson.databind.ObjectReader
com.fasterxml.jackson.databind.DeserializationContext
com.fasterxml.jackson.databind.deser.DeserializerCache
com.fasterxml.jackson.databind.deser.BeanDeserializerFactory
