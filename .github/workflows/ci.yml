name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Run tests and package the agent
        run: mvn -B verify
      - name: Verify javassist relocation
        run: scripts/verify-shading.sh
      - name: Coverage summary
        if: always()
        run: scripts/coverage-summary.sh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: target/site/jacoco
